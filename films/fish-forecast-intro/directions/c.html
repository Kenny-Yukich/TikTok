<!doctype html>
<html><head><meta charset="utf-8"><title>C · Up the river</title>
<link rel="stylesheet" href="brand.css">
<style>
  .frame { background: var(--paper); color: var(--text); }
  .river { position: absolute; inset: 0; }
  .eyebrow { position: absolute; left: 80px; top: 150px; color: var(--muted); }
  h1 { position: absolute; left: 74px; top: 196px; font-size: 112px; color: var(--text); }
  h1 em { color: var(--river-deep); }
  /* salmon swim upstream: the fish heads up the river, toward the top of the phone */
  .fish { position: absolute; left: 330px; top: 1660px; width: 380px; transform: rotate(-44deg); filter: drop-shadow(0 18px 18px oklch(40% 0.08 245 / .35)); }
  .pin { position: absolute; display: flex; align-items: center; gap: 20px; }
  .pin .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .pin .ring svg { position: absolute; inset: 0; }
  .pin .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 500 38px var(--mono); letter-spacing: -0.04em; color: var(--text); }
  .pin h3 { margin: 0; font: 400 52px/1 var(--display); letter-spacing: -0.02em; }
  .pin small { display: block; margin-top: 8px; font: 400 25px/1.25 var(--sans); color: var(--muted); }
  .lead { position: absolute; height: 2px; background: var(--ink); }
  .dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--sun); border: 4px solid var(--ink); }
</style></head>
<body><div class="frame" data-width="1080" data-height="1920">
  <!-- one winding river in the artwork's own blues, riffles in paper white -->
  <svg class="river" viewBox="0 0 1080 1920">
    <defs><path id="r" d="M 940 -80 C 960 240, 900 420, 640 560 S 230 800, 300 1000 S 860 1260, 760 1480 S 260 1760, 300 2000"/></defs>
    <use href="#r" fill="none" stroke="var(--river-deep)" stroke-width="128" stroke-linecap="round"/>
    <use href="#r" fill="none" stroke="var(--river)" stroke-width="104" stroke-linecap="round"/>
    <use href="#r" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round" stroke-dasharray="46 70" stroke-dashoffset="10" opacity=".85"/>
    <use href="#r" transform="translate(18 6)" fill="none" stroke="var(--paper)" stroke-width="4" stroke-linecap="round" stroke-dasharray="20 110" opacity=".7"/>
    <use href="#r" transform="translate(-18 -6)" fill="none" stroke="var(--paper)" stroke-width="4" stroke-linecap="round" stroke-dasharray="28 96" stroke-dashoffset="40" opacity=".7"/>
  </svg>
  <div class="eyebrow">This week's short list</div>
  <h1 class="display">Worth the <em>drive.</em></h1>

  <div class="lead" style="left:362px; top:840px; width:110px"></div><div class="dot" style="left:362px; top:840px"></div>
  <div class="pin" style="left:472px; top:788px">
    <div class="ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="var(--paper)" stroke="oklch(90% 0.02 95)" stroke-width="9"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-dasharray="210 277" transform="rotate(-90 52 52)"/></svg><b>76</b></div>
    <div><h3>Cowlitz River</h3><small>Barrier Dam to Blue Creek</small></div>
  </div>

  <div class="lead" style="left:470px; top:1560px; width:240px"></div><div class="dot" style="left:710px; top:1560px"></div>
  <div class="pin" style="left:70px; top:1508px; flex-direction: row-reverse; text-align: right">
    <div class="ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="var(--paper)" stroke="oklch(90% 0.02 95)" stroke-width="9"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-dasharray="199 277" transform="rotate(-90 52 52)"/></svg><b>72</b></div>
    <div><h3>Crooked River</h3><small>Bowman Dam to Castle Rock</small></div>
  </div>

  <img class="fish" src="../assets/weather-fish.webp" alt="">
</div></body></html>
