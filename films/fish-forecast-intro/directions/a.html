<!doctype html>
<html><head><meta charset="utf-8"><title>A · The forecast clears</title>
<link rel="stylesheet" href="brand.css">
<style>
  .frame { background:
      radial-gradient(900px 700px at 78% 30%, oklch(34% 0.07 150 / .55), transparent 70%),
      linear-gradient(180deg, var(--ink-deep), oklch(25% 0.05 165)); color: var(--on-ink); }
  /* the real fish mark, big enough that its weather reads: storm over the back, sun at the head */
  .fish { position: absolute; left: -150px; top: 150px; width: 1320px; transform: rotate(-5deg); filter: drop-shadow(0 30px 40px oklch(15% 0.04 166 / .55)); }
  .streak { position: absolute; height: 6px; border-radius: 6px; background: linear-gradient(90deg, transparent, oklch(95% 0.02 120 / .35)); }
  .q { position: absolute; left: 80px; top: 830px; font-size: 118px; color: var(--on-ink); }
  .q em { display: block; color: var(--sun); padding-left: 60px; }
  .eyebrow { position: absolute; left: 84px; top: 1130px; color: var(--on-ink-muted); }
  .big { position: absolute; left: 70px; top: 1180px; font: 400 290px/.9 var(--mono); letter-spacing: -0.06em; color: var(--sun); font-variant-numeric: tabular-nums; }
  .lbl { position: absolute; left: 84px; top: 1500px; width: 820px; font: 400 40px/1.3 var(--sans); color: var(--on-ink-muted); }
  .lbl b { color: var(--on-ink); font-weight: 500; }
</style></head>
<body><div class="frame" data-width="1080" data-height="1920">
  <div class="streak" style="left:-40px; top:520px; width:300px"></div>
  <div class="streak" style="left:-60px; top:610px; width:220px"></div>
  <img class="fish" src="../assets/weather-fish.webp" alt="">
  <h1 class="display q">Are the fish <em>in the river yet?</em></h1>
  <div class="eyebrow">Bonneville Dam · 7 days to Nov 3</div>
  <div class="big">4,496</div>
  <div class="lbl"><b>adult Chinook, coho and steelhead</b> counted climbing the ladder.</div>
</div></body></html>
